name: Release Chart

on:
  push:
    branches:
      - release

concurrency:
  group: chart-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package & Publish OCI Chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Read chart version
        id: chart
        run: |
          VERSION=$(grep '^version:' Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: release
          custom_tag: ${{ steps.chart.outputs.version }}
          tag_prefix: v

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: "4.2.3"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package chart
        id: package
        if: ${{ steps.tag.outputs.new_tag != '' }}
        run: |
          VERSION="${{ steps.tag.outputs.new_version }}"
          CHART_FILE="hermes-agent-${VERSION}.tgz"
          helm package . \
            --version "${VERSION}"
          echo "chart_file=${CHART_FILE}" >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR
        if: ${{ steps.tag.outputs.new_tag != '' }}
        run: |
          CHART_FILE="${{ steps.package.outputs.chart_file }}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm push "$CHART_FILE" "oci://ghcr.io/${OWNER}"

      - name: Create GitHub Release
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.new_tag }}"
          CHART_FILE="${{ steps.package.outputs.chart_file }}"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            "$CHART_FILE"
