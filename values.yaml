nameOverride: ""
fullnameOverride: ""

image:
  repository: nousresearch/hermes-agent
  # Yes, this was set to appVersion, but moved it here so we're nice and explicit on which tag we're using
  tag: "v2026.8.3"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Hermes stores mutable state under HERMES_HOME, so a single replica is the
# safe default when persistence is enabled.
replicaCount: 1
revisionHistoryLimit: 5

strategy:
  type: Recreate

# The official image entrypoint already bootstraps Hermes and execs `hermes`.
# These args become `hermes <args...>`.
command: []
args:
  - gateway
  - run
workingDir: /opt/hermes

bootstrap:
  enabled: true
  # When true, overwrite the persisted config/SOUL with Helm-rendered content.
  # When false, seed only if the file does not already exist in the PVC.
  overwrite: false
  # Optionally consume config bootstrap data from an externally managed
  # ConfigMap instead of the chart-managed one.
  existingConfigMap: ""
  configKey: config.yaml
  soulKey: SOUL.md

config:
  # Raw YAML string rendered via tpl. When non-empty, it takes precedence over
  # config.values.
  raw: ""
  # Partial Hermes config.yaml written into HERMES_HOME/config.yaml.
  values: {}
soul:
  text: ""

env:
  WEB_TOOLS_DEBUG: "false"
  VISION_TOOLS_DEBUG: "false"
  MOA_TOOLS_DEBUG: "false"
  IMAGE_TOOLS_DEBUG: "false"
  GATEWAY_ALLOW_ALL_USERS: "false"
  WHATSAPP_ENABLED: "false"
  WHATSAPP_ALLOWED_USERS: ""
  TELEGRAM_ALLOWED_USERS: ""
  TELEGRAM_HOME_CHANNEL: ""
  DISCORD_ALLOWED_USERS: ""
  DISCORD_HOME_CHANNEL: ""
  SLACK_ALLOWED_USERS: ""
  SIGNAL_ALLOWED_USERS: ""
  SIGNAL_GROUP_ALLOWED_USERS: ""

extraEnv:
  # S6_KEEP_ENV: prevents environment reset between s6 stages; the entire
  # supervision tree inherits the original env vars without needing
  # with-contenv to call s6-applyuidgid (which requires CAP_SETGID and
  # fails when the container runs as non-root with all capabilities dropped).
  - name: S6_KEEP_ENV
    value: "1"
  # S6_READ_ONLY_ROOT: instructs s6-overlay stage2 to copy /etc to
  # /run/s6/etc before applying permission changes. Required when the
  # overlay /etc path cannot be written directly (e.g. read-only layer).
  - name: S6_READ_ONLY_ROOT
    value: "1"
extraEnvFrom: []

# Option 1: chart-managed Secret or reference to an existing Secret.
secrets:
  existingSecret: ""
  annotations: {}
  OPENROUTER_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GOOGLE_API_KEY: ""
  GEMINI_API_KEY: ""
  GLM_API_KEY: ""
  KIMI_API_KEY: ""
  MINIMAX_API_KEY: ""
  MINIMAX_CN_API_KEY: ""
  HF_TOKEN: ""
  XIAOMI_API_KEY: ""
  AI_GATEWAY_API_KEY: ""
  NOUS_API_KEY: ""
  EXA_API_KEY: ""
  FIRECRAWL_API_KEY: ""
  FAL_KEY: ""
  GROQ_API_KEY: ""
  VOICE_TOOLS_OPENAI_KEY: ""
  API_SERVER_KEY: ""
  TELEGRAM_BOT_TOKEN: ""
  DISCORD_BOT_TOKEN: ""
  SLACK_BOT_TOKEN: ""
  SLACK_APP_TOKEN: ""
  SIGNAL_HTTP_URL: ""
  SIGNAL_ACCOUNT: ""
  BROWSERBASE_API_KEY: ""
  BROWSERBASE_PROJECT_ID: ""
  HONCHO_API_KEY: ""
  TINKER_API_KEY: ""
  WANDB_API_KEY: ""
  GITHUB_TOKEN: ""
  SUDO_PASSWORD: ""
  WEBHOOK_SECRET: ""
  EMAIL_ADDRESS: ""
  EMAIL_PASSWORD: ""
  EMAIL_IMAP_HOST: ""
  EMAIL_IMAP_PORT: ""
  EMAIL_SMTP_HOST: ""
  EMAIL_SMTP_PORT: ""
  MISTRAL_API_KEY: ""
  DINGTALK_CLIENT_ID: ""
  DINGTALK_CLIENT_SECRET: ""
  FEISHU_APP_ID: ""
  FEISHU_APP_SECRET: ""
  FEISHU_ENCRYPT_KEY: ""
  FEISHU_VERIFICATION_TOKEN: ""
  WECOM_BOT_ID: ""
  WECOM_SECRET: ""
  WECOM_CALLBACK_CORP_ID: ""
  WECOM_CALLBACK_CORP_SECRET: ""
  WECOM_CALLBACK_AGENT_ID: ""
  WECOM_CALLBACK_TOKEN: ""
  WECOM_CALLBACK_ENCODING_AES_KEY: ""
  WEIXIN_ACCOUNT_ID: ""
  WEIXIN_TOKEN: ""
  BLUEBUBBLES_SERVER_URL: ""
  BLUEBUBBLES_PASSWORD: ""

# Option 2: external Secret - for secrets that are managed by an external system

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  target:
    name: ""
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations: {}
        labels: {}
  data: []
  dataFrom: []
  annotations: {}
  labels: {}

operator:
  enabled: false
  controllerClass: hermes.ai/default
  installCustomResources: true
  managementNamespace: ""
  defaultChartValues: {}
  tenants: []

tenant:
  id: ""
  labels: {}

apiServer:
  enabled: false
  host: "0.0.0.0"
  port: 8642
  corsOrigins: ""
  modelName: hermes-agent

webhook:
  enabled: false
  port: 8644

telegramWebhook:
  enabled: false
  url: ""
  port: 8443

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

rbac:
  create: false
  clusterWide: false
  annotations: {}
  rules: []

persistence:
  enabled: true
  existingClaim: ""
  mountPath: /opt/data
  accessMode: ReadWriteOnce
  size: 5Gi
  storageClass: ""
  annotations: {}

# Optional memory-backed /dev/shm volume for Chromium/Playwright.
# Enable this if local browser automation needs more shared memory.
browser:
  sharedMemory:
    enabled: false
    mountPath: /dev/shm
    sizeLimit: 1Gi

service:
  enabled: false
  type: ClusterIP
  annotations: {}
  labels: {}
  sessionAffinity: None
  externalTrafficPolicy: ""
  internalTrafficPolicy: ""
  loadBalancerSourceRanges: []
  # When empty, the chart automatically exposes enabled apiServer/webhook/
  # telegramWebhook listeners using their configured port values. Explicit
  # entries override the defaults.
  # ports:
  #   - name: api-server
  #     port: 8642
  #     targetPort: 8642
  #     containerPort: 8642
  #     protocol: TCP
  ports: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hermes.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  servicePortNumber: null

virtualService:
  enabled: false
  gateways: []
  hosts: []
  timeout: "3600s"
  servicePortNumber: null

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

tenantIsolation:
  enabled: false
  allowSameNamespace: true
  authorizedNamespaces: []
  allowDns: true
  additionalEgress: []
  podAntiAffinity:
    enabled: false
    type: preferredDuringSchedulingIgnoredDuringExecution
    topologyKey: kubernetes.io/hostname

pdb:
  enabled: false
  minAvailable: 1

# Raw probe specs copied onto the container.
# Example HTTP probe for the Hermes API server:
# probes:
#   liveness:
#     httpGet:
#       path: /health
#       port: api-server
probes:
  liveness: {}
  readiness: {}
  startup: {}

npmPackages: []


# Example resource requests/limits.
#resources:
#  requests:
#    memory: 1Gi
#  limits:
#    memory: 4Gi

resources: {}
terminationGracePeriodSeconds: 120

podAnnotations: {}
deploymentAnnotations: {}
podLabels: {}

# The official Hermes image runs as UID/GID 10000.
# Override these values when using HERMES_UID or a custom image.
podSecurityContext:
  runAsUser: 10000
  runAsGroup: 10000
  fsGroup: 10000
  fsGroupChangePolicy: OnRootMismatch
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

priorityClassName: ""
runtimeClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraVolumes: []
extraVolumeMounts: []
extraInitContainers: []
extraContainers: []
extraObjects: []
